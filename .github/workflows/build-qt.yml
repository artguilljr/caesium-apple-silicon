name: Apple Silicon Mac App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon host
        run: test "$(uname -m)" = arm64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtimageformats
          cache: true
      - name: Prepare native dependencies and build fixes
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
          mkdir -p dependencies
          curl -fL --retry 3 https://github.com/sparkle-project/Sparkle/releases/download/1.27.1/Sparkle-1.27.1.tar.xz -o dependencies/sparkle.tar.xz
          tar -xf dependencies/sparkle.tar.xz -C dependencies
          lipo dependencies/Sparkle.framework/Sparkle -verify_arch arm64
          sudo mkdir -p /Library/Frameworks
          sudo cp -R dependencies/Sparkle.framework /Library/Frameworks/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CMakeLists.txt')
          s = p.read_text().replace('set(CMAKE_OSX_DEPLOYMENT_TARGET "11")', 'set(CMAKE_OSX_DEPLOYMENT_TARGET "12.0")')
          s = s.replace('libcaesium.so', 'libcaesium.dylib')
          s = s.replace('-F/Library/Frameworks -Wl -rpath @loader_path/../Frameworks', '-F/Library/Frameworks -Wl,-rpath,@loader_path/../Frameworks')
          p.write_text(s)
          p = Path('Info.plist')
          p.write_text(p.read_text().replace('<string>10.15</string>', '<string>12.0</string>').replace('<key>SUEnableAutomaticChecks</key>\n        <true/>', '<key>SUEnableAutomaticChecks</key>\n        <false/>'))
          import subprocess
          patch = "diff --git a/src/MainWindow.cpp b/src/MainWindow.cpp\nindex 3d2928c..fd93dbf 100644\n--- a/src/MainWindow.cpp\n+++ b/src/MainWindow.cpp\n@@ -15,6 +15,7 @@\n #include <QScrollBar>\n #include <QWheelEvent>\n #include <QWindow>\n+#include <QTimer>\n #include <QtConcurrent>\n #include <dialogs/AdvancedImportDialog.h>\n #include <dialogs/PreferencesDialog.h>\n@@ -428,9 +429,21 @@ void MainWindow::readSettings()\n \n void MainWindow::previewImage(const QModelIndex& imageIndex, bool forceRuntimePreview) const\n {\n+    // Preview work shares the global pool with compression. Never wait for it\n+    // on the GUI thread: a queued preview can be starved by a large batch.\n+    if (this->compressionWatcher->isRunning()) {\n+        this->pendingPreviewRequested = false;\n+        return;\n+    }\n+    if (!imageIndex.isValid() || imageIndex.row() >= this->cImageModel->rowCount()) {\n+        return;\n+    }\n     if (this->previewWatcher->isRunning()) {\n+        this->pendingPreviewIndex = imageIndex;\n+        this->pendingPreviewForce = forceRuntimePreview;\n+        this->pendingPreviewRequested = true;\n         this->previewWatcher->cancel();\n-        this->previewWatcher->waitForFinished();\n+        return;\n     }\n     if (!QSettings().value(\"mainwindow/previews_visible\", false).toBool()) {\n         return;\n@@ -630,15 +643,6 @@ void MainWindow::startCompression(bool onlyFailed)\n     this->compressionWatcher = new QFutureWatcher<void>();\n     connect(this->compressionWatcher, &QFutureWatcherBase::finished, this, &MainWindow::compressionFinished);\n     \n-    connect(this->compressionWatcher, &QFutureWatcherBase::finished, [this] {\n-        \n-        size_t rowCount = this->cImageModel->rowCount();\n-    \n-        for(size_t i = 0; i < rowCount; ++i) {\n-            this->cImageModel->emitDataChanged(i);\n-        }\n-    });\n-\n     connect(this->compressionWatcher, &QFutureWatcherBase::progressValueChanged, this->cImageModel, &CImageTreeModel::emitDataChanged);\n     connect(this->compressionWatcher, &QFutureWatcherBase::progressValueChanged, this, &MainWindow::updateCompressionProgressLabel);\n \n@@ -806,51 +810,81 @@ void MainWindow::imageList_selectionChanged()\n \n void MainWindow::compressionFinished()\n {\n+    qInfo() << \"Completion stage: entered\";\n     this->cImageModel->getRootItem()->setCompressionCanceled(false);\n-    if (ui->imageList_TreeView->selectionModel()->selectedRows().count() > 0) {\n-        this->previewImage(this->proxyModel->mapToSource(ui->imageList_TreeView->selectionModel()->selectedRows().at(0)));\n-    }\n-\n     compressionSummary.totalCompressedSize = this->cImageModel->compressedItemsSize();\n     compressionSummary.elapsedTime = compressionTimer.isValid() ? compressionTimer.elapsed() : 0;\n-\n-    if (QSettings().value(\"preferences/general/send_usage_reports\", true).toBool()) {\n-        this->networkOperations->sendUsageReport(compressionSummary);\n-    }\n-\n     qInfo() << \"Compression ended successfully.\\nTotal images:\" << compressionSummary.totalImages\n             << \"\\nUncompressed size:\" << toHumanSize(compressionSummary.totalUncompressedSize)\n             << \"\\nCompressed size:\" << toHumanSize(compressionSummary.totalCompressedSize)\n             << \"\\nElapsed time:\" << compressionSummary.elapsedTime << \"ms\";\n \n-    QString title = tr(\"Compression finished!\");\n-    QString saved = toHumanSize(compressionSummary.totalUncompressedSize - compressionSummary.totalCompressedSize);\n-    QString savedPerc = QString::number(round((compressionSummary.totalUncompressedSize - compressionSummary.totalCompressedSize) / compressionSummary.totalUncompressedSize * 100));\n+    const QString title = tr(\"Compression finished!\");\n+    const double savedBytes = compressionSummary.totalUncompressedSize - compressionSummary.totalCompressedSize;\n+    const QString saved = toHumanSize(savedBytes);\n+    const QString savedPerc = QString::number(compressionSummary.totalUncompressedSize > 0\n+        ? round(savedBytes / compressionSummary.totalUncompressedSize * 100) : 0);\n \n+    qInfo() << \"Completion stage: restoring interface\";\n     ui->cancelCompression_Button->hide();\n     ui->compression_ProgressBar->hide();\n     ui->compressionProgress_Label->hide();\n     this->toggleUIEnabled(true);\n-\n-    PostCompressionAction postCompressionAction = static_cast<PostCompressionAction>(QSettings().value(\"preferences/general/post_compression_action\", 0).toInt());\n-    if (postCompressionAction != PostCompressionAction::NO_ACTION) {\n-        PostCompressionActions::runAction(postCompressionAction, ui->outputFolder_LineEdit->text());\n+    // One range notification avoids tens of thousands of separate view/sort updates.\n+    const int rows = this->cImageModel->rowCount();\n+    if (rows > 0) {\n+        emit this->cImageModel->dataChanged(this->cImageModel->index(0, 0),\n+            this->cImageModel->index(rows - 1, this->cImageModel->columnCount() - 1));\n+    }\n+    qInfo() << \"Completion stage: interface restored\" << rows;\n+\n+    const int action = QSettings().value(\"preferences/general/post_compression_action\", 0).toInt();\n+    qInfo() << \"Completion stage: post-compression action\" << action;\n+    if (action != static_cast<int>(PostCompressionAction::NO_ACTION)) {\n+        PostCompressionActions::runAction(static_cast<PostCompressionAction>(action), ui->outputFolder_LineEdit->text());\n+        qInfo() << \"Completion stage: requested action returned\";\n         return;\n     }\n \n+    this->statusBar()->showMessage(title + \" \" + tr(\"You just saved %1!\").arg(saved));\n+#ifdef Q_OS_MAC\n+    // Keep completion feedback inside the app while diagnosing the native notification path.\n+    qInfo() << \"Completion stage: in-app notification displayed\";\n+#else\n     this->trayIcon->showMessage(title, tr(\"You just saved %1!\").arg(saved), QSystemTrayIcon::NoIcon);\n+#endif\n     if (!QSettings().value(\"preferences/general/skip_compression_dialogs\").toBool()) {\n-        QCaesiumMessageBox compressionSummaryDialog;\n-        compressionSummaryDialog.setText(title);\n-        compressionSummaryDialog.setInformativeText(tr(\"Total files: %1\\nOriginal size: %2\\nCompressed size: %3\\nSaved: %4 (%5%)\")\n-                .arg(QString::number(compressionSummary.totalImages),\n-                    toHumanSize(compressionSummary.totalUncompressedSize),\n-                    toHumanSize(compressionSummary.totalCompressedSize),\n-                    saved,\n-                    savedPerc));\n-        compressionSummaryDialog.addButton(tr(\"Ok\"), QMessageBox::AcceptRole);\n-        compressionSummaryDialog.exec();\n-    }\n+        qInfo() << \"Completion stage: opening summary\";\n+        auto* dialog = new QCaesiumMessageBox(this);\n+        dialog->setObjectName(\"compressionCompletionDialog\");\n+        dialog->setAttribute(Qt::WA_DeleteOnClose);\n+        dialog->setWindowModality(Qt::WindowModal);\n+        dialog->setText(title);\n+        dialog->setInformativeText(tr(\"Total files: %1\\nOriginal size: %2\\nCompressed size: %3\\nSaved: %4 (%5%)\")\n+            .arg(QString::number(compressionSummary.totalImages),\n+                toHumanSize(compressionSummary.totalUncompressedSize),\n+                toHumanSize(compressionSummary.totalCompressedSize), saved, savedPerc));\n+        dialog->addButton(tr(\"Ok\"), QMessageBox::AcceptRole);\n+        connect(dialog, &QDialog::finished, this, [](int result) {\n+            qInfo() << \"Completion stage: summary dismissed\" << result;\n+        });\n+        // Avoid a nested event loop inside the future watcher's finished signal.\n+        dialog->open();\n+        qInfo() << \"Completion stage: summary opened\";\n+    }\n+\n+    QTimer::singleShot(0, this, [this] {\n+        qInfo() << \"Completion stage: deferred follow-up entered\";\n+        if (ui->imageList_TreeView->selectionModel()->selectedRows().count() > 0) {\n+            const auto selected = ui->imageList_TreeView->selectionModel()->selectedRows().at(0);\n+            this->previewImage(this->proxyModel->mapToSource(selected));\n+        }\n+        if (QSettings().value(\"preferences/general/send_usage_reports\", true).toBool()) {\n+            this->networkOperations->sendUsageReport(compressionSummary);\n+        }\n+        qInfo() << \"Completion stage: deferred follow-up returned\";\n+    });\n+    qInfo() << \"Completion stage: handler returned\";\n }\n \n void MainWindow::on_actionRemove_triggered()\n@@ -1336,6 +1370,14 @@ void MainWindow::on_actionAuto_preview_toggled(bool toggled)\n \n void MainWindow::previewFinished() const\n {\n+    if (this->pendingPreviewRequested) {\n+        const QPersistentModelIndex index = this->pendingPreviewIndex;\n+        const bool force = this->pendingPreviewForce;\n+        this->pendingPreviewRequested = false;\n+        QTimer::singleShot(0, this, [this, index, force] {\n+            if (index.isValid()) this->previewImage(index, force);\n+        });\n+    }\n     ui->preview_GraphicsView->setZoomEnabled(true);\n     ui->previewCompressed_GraphicsView->setZoomEnabled(true);\n     ui->actionPreview->setEnabled(this->selectedCount == 1);\ndiff --git a/src/MainWindow.h b/src/MainWindow.h\nindex 0026261..f30f0ed 100644\n--- a/src/MainWindow.h\n+++ b/src/MainWindow.h\n@@ -6,6 +6,7 @@\n #include <QFutureWatcher>\n #include <QItemSelection>\n #include <QMainWindow>\n+#include <QPersistentModelIndex>\n #include <QShowEvent>\n #include <QSystemTrayIcon>\n #include <climits>\n@@ -109,11 +110,17 @@ private slots:\n     void installCompressionOptionsEventFilter() const;\n \n private:\n+#ifdef CAESIUM_COMPLETION_TEST\n+    friend class CompletionRegression;\n+#endif\n     Ui::MainWindow* ui;\n \n     CImageTreeModel* cImageModel;\n     QFutureWatcher<void>* compressionWatcher;\n     QFutureWatcher<ImagePreview>* previewWatcher;\n+    mutable QPersistentModelIndex pendingPreviewIndex;\n+    mutable bool pendingPreviewRequested = false;\n+    mutable bool pendingPreviewForce = false;\n     QMap<QString, int> folderMap;\n     AboutDialog* aboutDialog = nullptr;\n     QString lastOpenedDirectory;\n"
          subprocess.run(['git', 'apply', '-'], input=patch, text=True, check=True)
          Path('tests/CompletionRegression.cpp').write_text("#include <QApplication>\n#include <QSettings>\n#include <QStandardPaths>\n#include <QTemporaryDir>\n#include <QImage>\n#include <QTimer>\n#include <QMessageBox>\n#include <QSignalSpy>\n#include <QTest>\n#include <QPromise>\n#include <QElapsedTimer>\n#include <thread>\n#include <mutex>\n#include <condition_variable>\n#include \"MainWindow.h\"\n#include \"models/CImageTreeModel.h\"\n\nclass CompletionRegression {\npublic:\n    static bool run()\n    {\n        QTemporaryDir temp;\n        if (!temp.isValid()) return false;\n        const QString path = temp.filePath(\"fixture.jpg\");\n        QImage fixture(32, 32, QImage::Format_RGB32);\n        fixture.fill(Qt::blue);\n        if (!fixture.save(path, \"JPEG\")) return false;\n        MainWindow window;\n        window.show();\n        bool passed = true;\n        auto check = [&passed](bool condition, const char* message) {\n            qInfo() << (condition ? \"PASS\" : \"FAIL\") << message;\n            passed = passed && condition;\n        };\n        QSettings().setValue(\"preferences/general/skip_compression_dialogs\", false);\n        window.compressionFinished();\n        auto* emptyDialog = window.findChild<QMessageBox*>(\"compressionCompletionDialog\");\n        check(emptyDialog != nullptr, \"empty completion returns and creates a summary (no division by zero)\");\n        if (emptyDialog) emptyDialog->accept();\n        QCoreApplication::sendPostedEvents(nullptr, QEvent::DeferredDelete);\n\n        CImage seed(path);\n        seed.setStatus(CImageStatus::COMPRESSED);\n        QList<CImage*> images;\n        images.reserve(80026);\n        for (int i = 0; i < 80026; ++i) images.append(new CImage(seed));\n        window.cImageModel->appendItems(images, temp.path());\n        // Reproduce the sampled condition: active compression and an unfinished\n        // preview. A watchdog releases futures if the GUI mistakenly blocks.\n        auto checkPreviewWait = [&](bool compressing) {\n            QPromise<void> compression;\n            QPromise<ImagePreview> preview;\n            compression.start();\n            preview.start();\n            if (!compressing) compression.finish();\n            window.compressionWatcher->setFuture(compression.future());\n            window.previewWatcher->setFuture(preview.future());\n            std::mutex mutex;\n            std::condition_variable wake;\n            bool released = false;\n            std::thread watchdog([&] {\n                std::unique_lock<std::mutex> lock(mutex);\n                wake.wait_for(lock, std::chrono::milliseconds(1500), [&] { return released; });\n                if (compressing) compression.finish();\n                preview.finish();\n            });\n            QElapsedTimer timer;\n            timer.start();\n            window.previewImage(window.cImageModel->index(0, 0));\n            const auto elapsed = timer.elapsed();\n            {\n                std::lock_guard<std::mutex> lock(mutex);\n                released = true;\n            }\n            wake.notify_one();\n            watchdog.join();\n            check(elapsed < 500, compressing\n                ? \"selection during compression does not wait for unfinished preview\"\n                : \"rapid preview replacement does not block the GUI\");\n            QTest::qWait(100);\n        };\n        checkPreviewWait(true);\n        checkPreviewWait(false);\n        window.compressionSummary.totalImages = images.size();\n        window.compressionSummary.totalUncompressedSize = window.cImageModel->originalItemsSize();\n        QSignalSpy changed(window.cImageModel, &QAbstractItemModel::dataChanged);\n        window.compressionFinished();\n        check(changed.count() == 1, \"80,026 rows receive one range refresh\");\n        auto* summary = window.findChild<QMessageBox*>(\"compressionCompletionDialog\");\n        check(summary && summary->parentWidget() == &window, \"completion summary is parented to main window\");\n        check(summary && summary->isVisible(), \"completion summary is visible\");\n        check(window.isVisible(), \"main window remains visible after completion\");\n        QTest::qWait(200);\n        if (summary) summary->accept();\n        QCoreApplication::sendPostedEvents(nullptr, QEvent::DeferredDelete);\n        QTest::qWait(200);\n        check(window.isVisible(), \"main window remains open after summary dismissal\");\n        check(window.findChild<QMessageBox*>(\"compressionCompletionDialog\") == nullptr, \"dismissed summary is deleted\");\n\n        QSettings().setValue(\"preferences/general/skip_compression_dialogs\", true);\n        changed.clear();\n        window.compressionFinished();\n        QTest::qWait(200);\n        check(changed.count() == 1, \"repeat completion still uses one refresh\");\n        check(window.findChild<QMessageBox*>(\"compressionCompletionDialog\") == nullptr, \"skip-dialog preference is respected\");\n        check(window.isVisible(), \"skip-dialog completion leaves main window open\");\n        return passed;\n    }\n};\n\nint main(int argc, char** argv)\n{\n    QApplication app(argc, argv);\n    QCoreApplication::setOrganizationName(\"CaesiumRegression\");\n    QCoreApplication::setApplicationName(\"CompletionRegression\");\n    QStandardPaths::setTestModeEnabled(true);\n    QSettings().setValue(\"preferences/general/send_usage_reports\", false);\n    QSettings().setValue(\"preferences/general/check_updates_at_startup\", false);\n    QSettings().setValue(\"preferences/general/post_compression_action\", 0);\n    bool finished = false;\n    bool passed = false;\n    QTimer::singleShot(0, &app, [&] {\n        passed = CompletionRegression::run();\n        finished = true;\n        app.exit(passed ? 0 : 1);\n    });\n    app.exec();\n    return finished && passed ? 0 : 1;\n}\n")
          with Path('CMakeLists.txt').open('a') as f:
              f.write("\nif (APPLE)\n    find_package(Qt6 COMPONENTS Test REQUIRED)\n    set(COMPLETION_SOURCES ${SOURCES})\n    list(REMOVE_ITEM COMPLETION_SOURCES src/main.cpp)\n    add_executable(completion_regression tests/CompletionRegression.cpp ${COMPLETION_SOURCES} ${OSX_SOURCES} ${UI} ${RESOURCES} ${QM_FILES})\n    target_compile_definitions(completion_regression PRIVATE CAESIUM_COMPLETION_TEST)\n    add_dependencies(completion_regression libcaesium)\n    set_target_properties(completion_regression PROPERTIES LINK_FLAGS \"-F/Library/Frameworks -Wl,-rpath,/Library/Frameworks\")\n    target_link_libraries(completion_regression PRIVATE Qt${QT_VERSION_MAJOR}::Widgets Qt${QT_VERSION_MAJOR}::Core Qt${QT_VERSION_MAJOR}::Gui Qt${QT_VERSION_MAJOR}::Concurrent Qt${QT_VERSION_MAJOR}::Svg Qt${QT_VERSION_MAJOR}::Network Qt${QT_VERSION_MAJOR}::Test ${OSX_FRAMEWORKS} caesium)\nendif ()\n")
          p = Path('src/main.cpp')
          p.write_text(p.read_text().replace('setApplicationVersion("2.8.5")', 'setApplicationVersion("2.8.5-mac.3")'))
          p = Path('Info.plist')
          p.write_text(p.read_text().replace('<key>CFBundleVersion</key>\n        <string>2.8.5</string>', '<key>CFBundleVersion</key>\n        <string>2.8.503</string>'))
          PY
      - name: Configure and compile native app and tests
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
          CARGO_BUILD_TARGET: aarch64-apple-darwin
        run: |
          set -euo pipefail
          # Rust host is ARM64; keep Cargo output at the path expected by upstream CMake.
          unset CARGO_BUILD_TARGET
          cmake -S . -B build-arm64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DSPARKLE_INCLUDE_DIR=/Library/Frameworks/Sparkle.framework/Headers -DLIBSSH_INCLUDE_DIR="$(xcrun --show-sdk-path)/usr/include"
          cmake --build build-arm64 --config Release --parallel 3
          QT_QPA_PLATFORM=offscreen ./build-arm64/tests/CsTests
          DYLD_LIBRARY_PATH="$PWD/build-arm64/libcaesium-prefix/src/libcaesium/target/release" ./build-arm64/completion_regression 2>&1 | tee build-arm64/completion-regression.log
      - name: Bundle standalone application
        shell: bash
        run: |
          set -euo pipefail
          app='build-arm64/Caesium Image Compressor.app'
          mkdir -p "$app/Contents/Frameworks"
          cp build-arm64/libcaesium-prefix/src/libcaesium/target/release/libcaesium.dylib "$app/Contents/Frameworks/"
          cp -R dependencies/Sparkle.framework "$app/Contents/Frameworks/"
          exe="$app/Contents/MacOS/Caesium Image Compressor"
          old=$(otool -L "$exe" | awk '/libcaesium/ {print $1}')
          install_name_tool -change "$old" '@rpath/libcaesium.dylib' "$exe"
          install_name_tool -id '@rpath/libcaesium.dylib' "$app/Contents/Frameworks/libcaesium.dylib"
          "$QT_ROOT_DIR/bin/macdeployqt" "$app" -always-overwrite
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          lipo "$exe" -verify_arch arm64
          lipo "$app/Contents/Frameworks/libcaesium.dylib" -verify_arch arm64
          otool -L "$exe"
          # Remove original build libraries so launch proves bundled library resolution.
          mv build-arm64/libcaesium-prefix/src/libcaesium/target/release build-arm64/rust-build-hidden
          "$exe" > build-arm64/launch.log 2>&1 &
          app_pid=$!
          sleep 12
          kill -0 "$app_pid" || { cat build-arm64/launch.log; exit 1; }
          kill "$app_pid"
          mkdir -p dist
          cp LICENSE dist/LICENSE.txt
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/Caesium-Apple-Silicon.zip
          mkdir -p dmg-root
          ditto "$app" 'dmg-root/Caesium Image Compressor.app'
          cp LICENSE dmg-root/LICENSE.txt
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname 'Caesium Apple Silicon' -srcfolder dmg-root -ov -format UDZO dist/Caesium-Apple-Silicon-Preview-Fix.dmg
      - name: Upload finished Mac app
        uses: actions/upload-artifact@v4
        with:
          name: Caesium-Apple-Silicon-App
          path: dist/*
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mac-build-diagnostics
          path: |
            build-arm64/launch.log
            build-arm64/completion-regression.log
            build-arm64/libcaesium-prefix/src/libcaesium-stamp/*.log
          if-no-files-found: ignore


